[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical-trials-mcp-server"
version = "0.1.0"
description = "MCP server that gives an LLM structured access to the ClinicalTrials.gov API v2."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Sai Rajiv Nagula" },
]
keywords = ["mcp", "model-context-protocol", "clinical-trials", "fastmcp", "llm-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "coverage>=7.5",
]

[project.scripts]
clinical-trials-mcp = "clinical_trials_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_trials_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["clinical_trials_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
